# Define o servidor virtual responsável por receber as requisições HTTP.
server {
    # Escuta a porta 80 tanto em IPv4 quanto em IPv6 dentro do container.
    listen 80;
    listen [::]:80;

    # O caractere "_" funciona como servidor padrão para qualquer hostname.
    server_name _;

    # Por segurança, apenas a pasta public do Laravel fica acessível pela web.
    root /var/www/html/public;

    # O front controller do Laravel é usado como arquivo inicial.
    index index.php;

    # Define UTF-8 como codificação padrão das respostas.
    charset utf-8;

    # Limita uploads e corpos de requisição a 20 MB.
    client_max_body_size 20m;

    # Primeiro tenta servir um arquivo ou diretório existente. Quando nenhum
    # deles existe, encaminha a URL completa ao index.php para o Laravel
    # resolver a rota. A query string original também é preservada.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Somente o front controller pode ser executado como PHP. O Nginx não
    # interpreta PHP; ele envia a requisição ao serviço PHP-FPM chamado "app".
    location = /index.php {
        # Carrega os parâmetros FastCGI padrão fornecidos pela imagem do Nginx.
        include fastcgi_params;

        # "app" é o nome do serviço no Compose e 9000 é a porta do PHP-FPM.
        fastcgi_pass app:9000;

        # Informa ao PHP-FPM qual script deve ser executado e qual é a raiz web.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        # Evita que um header Proxy enviado pelo cliente afete o ambiente PHP.
        fastcgi_param HTTP_PROXY "";
    }

    # Serve assets estáticos diretamente pelo Nginx, sem envolver o Laravel.
    # O navegador pode armazená-los em cache por sete dias. Requisições desses
    # arquivos não são registradas no access log para reduzir ruído.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Bloqueia arquivos e diretórios ocultos, como .env e .git.
    location ~ /\. {
        deny all;
    }

    # Impede a execução direta de qualquer outro arquivo PHP. Toda requisição
    # dinâmica deve passar exclusivamente pelo public/index.php do Laravel.
    location ~ \.php$ {
        return 404;
    }
}
